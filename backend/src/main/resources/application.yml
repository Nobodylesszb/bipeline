spring:
  application:
    name: pipeline-backend
  datasource:
    url: ${PIPELINE_DB_URL:jdbc:postgresql://localhost:5432/pipeline_dev}
    username: ${PIPELINE_DB_USERNAME:bo}
    password: ${PIPELINE_DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PIPELINE_SERVER_PORT:8080}
